<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Let'sCosplay — Rental Kostum Cosplay (Standalone UI/UX)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

        :root {
            color-scheme: light;
            --page: #fbf8fa;
            --surface: #ffffff;
            --surface-soft: #f6f1f5;
            --surface-pink: #fff0f6;
            --text: #201921;
            --muted: #77717d;
            --line: #e9e1e9;
            --pink: #f45193;
            --pink-deep: #d9387b;
            --green: #239b68;
            --amber: #d99018;
            --red: #d9485f;
            --shadow: 0 16px 42px rgb(45 24 40 / 8%);
            font-family: 'Poppins', sans-serif;
        }

        html[data-theme='dark'] {
            color-scheme: dark;
            --page: #17131b;
            --surface: #211b25;
            --surface-soft: #2a232f;
            --surface-pink: #382432;
            --text: #f6f3f7;
            --muted: #aaa1ae;
            --line: #39313e;
            --pink: #ff6aa7;
            --pink-deep: #f45193;
            --green: #52c796;
            --amber: #f0b74e;
            --red: #fa7587;
            --shadow: 0 18px 48px rgb(0 0 0 / 22%);
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            min-width: 320px;
            margin: 0;
            color: var(--text);
            background: radial-gradient(ellipse at 2% 2%, rgb(244 81 147 / 8%), transparent 26rem), var(--page);
            transition: color .2s ease, background-color .2s ease;
        }
        button, input, select, textarea { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button { color: inherit; cursor: pointer; }
        a { color: inherit; text-decoration: none; }
        img { display: block; max-width: 100%; }
        .material-symbols-outlined { font-size: 20px; line-height: 1; vertical-align: middle; }

        #app { min-height: 100vh; display: flex; flex-direction: column; }
        .container { width: min(1200px, calc(100% - 48px)); margin-inline: auto; }
        .eyebrow { color: var(--pink-deep); text-transform: uppercase; font-size: .73rem; font-weight: 800; letter-spacing: .12em; }
        .muted { color: var(--muted); }
        .small { font-size: .83rem; }

        .site-header { position: sticky; z-index: 20; top: 0; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--page) 91%, transparent); backdrop-filter: blur(18px); }
        .header-main { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 28px; }
        .brand { display: inline-flex; align-items: center; gap: 10px; }
        .brand-mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; color: white; background: var(--pink); font-weight: 700; }
        .brand-name { font-weight: 700; font-size: 1.08rem; }
        .brand-name span { color: var(--pink-deep); }
        
        .main-nav { display: flex; gap: 5px; }
        .nav-link { padding: 10px 14px; color: var(--muted); font-size: .86rem; font-weight: 700; border-radius: 10px; }
        .nav-link:hover, .nav-link.active { color: var(--text); background: var(--surface-soft); }

        .header-actions { display: flex; align-items: center; gap: 9px; }
        .button { min-height: 40px; padding: 10px 16px; border: 1px solid transparent; border-radius: 11px; font-weight: 700; font-size: .85rem; display: inline-flex; align-items: center; gap: 6px; }
        .button-primary { color: white; background: var(--pink); }
        .button-secondary { border-color: var(--line); background: var(--surface); }
        .button-soft { color: var(--pink-deep); background: var(--surface-pink); }
        .button-small { min-height: 32px; padding: 6px 12px; font-size: .78rem; }
        .icon-button { width: 40px; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }

        .role-banner { background: var(--surface-pink); border-bottom: 1px solid var(--pink); padding: 8px 16px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--pink-deep); }

        main { flex: 1; }
        .page-wrap { padding: 40px 0 68px; }
        .page-intro { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; }
        .page-title { font-size: 2.3rem; margin: 0; }
        .breadcrumb { display: flex; gap: 8px; margin-bottom: 16px; color: var(--muted); font-size: .78rem; }

        .product-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 19px; }
        .product-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
        .product-photo { position: relative; aspect-ratio: 4 / 4.6; background: var(--surface-soft); }
        .product-photo img { width: 100%; height: 100%; object-fit: cover; }
        .product-tag { position: absolute; top: 12px; left: 12px; padding: 4px 8px; color: #8b2754; background: #fff0f6; font-size: .68rem; font-weight: 800; border-radius: 6px; }
        .product-info { padding: 14px; }
        .product-meta { display: flex; justify-content: space-between; font-size: .74rem; color: var(--muted); }
        .product-name { font-weight: 700; font-size: 1rem; margin: 8px 0; }
        .product-price { font-weight: 800; font-size: .95rem; }
        .availability { color: var(--green); font-weight: 700; font-size: .72rem; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }

        .catalog-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; }
        .filter-panel { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); height: fit-content; }
        .filter-label { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: .82rem; color: var(--muted); cursor: pointer; }

        .detail-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: start; }
        .detail-main-image { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; }
        .detail-price { font-size: 1.5rem; font-weight: 700; margin: 20px 0; }
        .size-row { display: flex; gap: 8px; margin-top: 8px; }
        .size-option { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 700; }
        .size-option.selected { color: var(--pink-deep); border-color: var(--pink); background: var(--surface-pink); }
        .price-box { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin: 20px 0; }
        .price-line { display: flex; justify-content: space-between; margin: 8px 0; font-size: .85rem; color: var(--muted); }
        .price-line.total { color: var(--text); font-weight: 800; border-top: 1px solid var(--line); padding-top: 10px; }

        .checkout-layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
        .form-section { padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 16px; }
        .field { display: grid; gap: 6px; margin-bottom: 12px; }
        .field label { font-size: .78rem; font-weight: 700; }
        .input, .textarea, .select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); }
        .textarea { min-height: 80px; }
        .notice { padding: 12px; border-radius: 8px; background: color-mix(in srgb, var(--amber) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--amber) 30%, var(--line)); font-size: .78rem; }

        .order-card { display: grid; grid-template-columns: 80px 1fr auto; gap: 16px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 12px; }
        .order-card img { width: 80px; height: 90px; object-fit: cover; border-radius: 8px; }
        .status-pill { display: inline-block; padding: 4px 10px; border-radius: 99px; background: color-mix(in srgb, var(--amber) 15%, transparent); color: var(--amber); font-size: .7rem; font-weight: 800; margin-top: 6px; }

        .admin-shell { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 76px); }
        .admin-sidebar { padding: 20px; border-right: 1px solid var(--line); background: var(--surface); }
        .admin-nav a { display: block; padding: 10px; color: var(--muted); font-weight: 700; border-radius: 8px; margin-bottom: 4px; cursor: pointer; }
        .admin-nav a:hover, .admin-nav a.active { color: var(--pink-deep); background: var(--surface-pink); }
        .admin-content { padding: 28px; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
        .stat-card { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
        .stat-card strong { font-size: 1.5rem; display: block; margin-top: 8px; }
        .table-wrap { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: .8rem; }
        .data-table th, .data-table td { padding: 10px; border-bottom: 1px solid var(--line); }
        .data-table th { color: var(--muted); font-size: .7rem; text-transform: uppercase; }

        .toast { position: fixed; right: 20px; bottom: 20px; background: #28212d; color: white; padding: 12px 18px; border-radius: 8px; font-size: .85rem; z-index: 50; box-shadow: var(--shadow); }

        .site-footer { margin-top: 40px; padding: 30px 0; border-top: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: .82rem; }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 24px; }
        .footer-bottom { display: flex; justify-content: space-between; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .75rem; }

        @media(max-width: 768px) {
            .product-grid { grid-template-columns: repeat(2, 1fr); }
            .detail-layout, .checkout-layout, .admin-shell { grid-template-columns: 1fr; }
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const STORAGE_KEYS = { theme: 'letscosplay-theme', orders: 'letscosplay-orders', role: 'letscosplay-role' };

        const seedProducts = [
            { id: 'c1', name: 'Raiden Shogun', series: 'Genshin Impact', category: 'Game', size: ['S', 'M', 'L'], price: 175000, deposit: 87500, stock: 3, rating: 4.9, reviews: 28, tag: 'Terlaris', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Cosplay_of_Raiden_Shogun_DSCF1208.jpg/900px-Cosplay_of_Raiden_Shogun_DSCF1208.jpg', description: 'Cosplay Raiden Shogun dengan palet ungu Inazuma, obi merah, dan detail motif Electro.', accessories: ['Wig ungu', 'Obi & aksesori rambut', 'Prop pedang foam'] },
            { id: 'c2', name: 'Kamado Nezuko', series: 'Demon Slayer', category: 'Anime', size: ['S', 'M'], price: 120000, deposit: 60000, stock: 4, rating: 4.9, reviews: 34, tag: 'Favorit', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Cosplay_of_Nezuko_Kamado_at_Made_in_Asia_2022_%2852111635324%29.jpg/900px-Cosplay_of_Nezuko_Kamado_at_Made_in_Asia_2022_%2852111635324%29.jpg', description: 'Cosplay kimono Nezuko dengan haori gelap, obi merah muda, dan bambu prop.', accessories: ['Haori hitam', 'Obi merah muda', 'Bambu prop'] },
            { id: 'c3', name: 'Gojo Satoru', series: 'Jujutsu Kaisen', category: 'Anime', size: ['M', 'L', 'XL'], price: 150000, deposit: 75000, stock: 2, rating: 4.8, reviews: 19, tag: 'Pilihan', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Satoru_Goj%C5%8D_cosplay.jpg/720px-Satoru_Goj%C5%8D_cosplay.jpg', description: 'Seragam hitam Gojo dengan blindfold dan rambut putih khas penyihir.', accessories: ['Blindfold hitam', 'Wig putih', 'Jubah seragam'] },
            { id: 'c4', name: 'Hatsune Miku', series: 'Vocaloid', category: 'Anime', size: ['S', 'M'], price: 135000, deposit: 67500, stock: 3, rating: 4.9, reviews: 22, tag: 'Idol', image: 'https://images.unsplash.com/photo-1722608577993-b8db8a9ce5cf?auto=format&fit=crop&w=900&q=85', description: 'Cosplay idol virtual dengan wig twin-tail biru toska dan aksen futuristik.', accessories: ['Wig twin-tail toska', 'Headset Miku', 'Dasi'] }
        ];

        const state = {
            page: 'home',
            role: localStorage.getItem(STORAGE_KEYS.role) || 'customer',
            productId: 'c1',
            size: 'M',
            days: 3,
            category: '',
            adminSection: 'overview',
            orders: JSON.parse(localStorage.getItem(STORAGE_KEYS.orders) || '[]')
        };

        const money = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);
        const showToast = (msg) => {
            document.querySelector('.toast')?.remove();
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.append(t);
            setTimeout(() => t.remove(), 2800);
        };

        const navigate = (page) => {
            state.page = page;
            window.scrollTo({ top: 0, behavior: 'instant' });
            render();
        };

        const toggleRole = () => {
            state.role = state.role === 'customer' ? 'admin' : 'customer';
            localStorage.setItem(STORAGE_KEYS.role, state.role);
            state.page = state.role === 'admin' ? 'admin' : 'home';
            render();
            showToast(`Beralih ke Mode: ${state.role === 'admin' ? 'Admin Rental' : 'Penyewa'}`);
        };

        const header = () => `
            <div class="role-banner">
                <span>✨ <strong>Demo Presentasi Dosen:</strong> Anda sedang melihat <strong>Let'sCosplay</strong> (${state.role === 'admin' ? 'Sisi Admin' : 'Sisi Penyewa'}).</span>
                <button onclick="toggleRole()" class="button button-primary button-small">Ganti ke Mode ${state.role === 'admin' ? 'Penyewa' : 'Admin'}</button>
            </div>
            <header class="site-header">
                <div class="container header-main">
                    <a class="brand" href="#" onclick="navigate('home')"><span class="brand-mark">LC</span><span class="brand-name">Let's<span>Cosplay</span></span></a>
                    <nav class="main-nav">
                        ${state.role === 'admin' ? `
                            <a href="#" onclick="state.adminSection='overview';render()" class="nav-link ${state.adminSection==='overview'?'active':''}">Dashboard</a>
                            <a href="#" onclick="state.adminSection='inventory';render()" class="nav-link ${state.adminSection==='inventory'?'active':''}">Katalog</a>
                            <a href="#" onclick="state.adminSection='orders';render()" class="nav-link ${state.adminSection==='orders'?'active':''}">Verifikasi Pesanan</a>
                        ` : `
                            <a href="#" onclick="navigate('home')" class="nav-link ${state.page==='home'?'active':''}">Beranda</a>
                            <a href="#" onclick="navigate('catalog')" class="nav-link ${state.page==='catalog'?'active':''}">Katalog Kostum</a>
                            <a href="#" onclick="navigate('orders')" class="nav-link ${state.page==='orders'?'active':''}">Pesanan Saya (${state.orders.length})</a>
                        `}
                    </nav>
                    <div class="header-actions">
                        <button class="icon-button" onclick="const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem(STORAGE_KEYS.theme,t);render()" aria-label="Tema">
                            <span class="material-symbols-outlined">light_mode</span>
                        </button>
                    </div>
                </div>
            </header>`;

        const footer = () => `
            <footer class="site-footer">
                <div class="container">
                    <div class="footer-grid">
                        <div><a class="brand" href="#" onclick="navigate('home')"><span class="brand-mark">LC</span><span class="brand-name">Let's<span>Cosplay</span></span></a><p>Sistem Informasi Rental Kostum Berbasis Web untuk Wilayah Palembang & Indralaya.</p></div>
                        <div><h4>Navigasi</h4><p><a href="#" onclick="navigate('catalog')">Katalog Kostum</a></p><p><a href="#" onclick="navigate('orders')">Pesanan Saya</a></p></div>
                        <div><h4>Kontak</h4><p>WhatsApp: 08xx-xxxx-xxxx</p><p>Kampus Fasilkom Unsri</p></div>
                    </div>
                    <div class="footer-bottom"><span>© 2026 Let'sCosplay. Prototype Akademik.</span><span>Hilma Rida Azzahra (09010282428049)</span></div>
                </div>
            </footer>`;

        const productCard = (p) => `
            <article class="product-card">
                <div class="product-photo">
                    <img src="${p.image}" alt="${p.name}" loading="lazy">
                    ${p.tag ? `<span class="product-tag">${p.tag}</span>` : ''}
                </div>
                <div class="product-info">
                    <div class="product-meta"><span>${p.category} · ${p.series}</span><span class="availability">Tersedia</span></div>
                    <h3 class="product-name">${p.name}</h3>
                    <div class="card-bottom">
                        <div><div class="product-price">${money(p.price)} <small>/ hari</small></div><div class="small muted">★ ${p.rating}</div></div>
                        <button class="button button-soft button-small" onclick="state.productId='${p.id}';navigate('detail')">Detail</button>
                    </div>
                </div>
            </article>`;

        const homePage = () => `
            <section style="position:relative; min-height:460px; display:flex; align-items:center; color:white; background:#281d2a; padding:60px 0;">
                <img style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.45;" src="https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=1600&q=80" alt="Hero">
                <div class="container" style="position:relative; z-index:1;">
                    <span class="eyebrow" style="color:#ffb8d2">Sewa kostum anime & game</span>
                    <h1 style="margin:12px 0; font-size:3rem; line-height:1.1;">Panggung cerita<br>ada di tanganmu.</h1>
                    <p style="color:rgb(255 255 255 / 85%); max-width:480px; margin-bottom:24px;">Kostum terawat berkualitas tinggi untuk convention, pemotretan, dan event impianmu di Palembang & Indralaya.</p>
                    <button class="button button-primary" onclick="navigate('catalog')">Jelajahi Katalog Kostum</button>
                </div>
            </section>
            <div class="container" style="padding-top:40px;">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px;">
                    <div><span class="eyebrow">Populer</span><h2>Kostum Pilihan Minggu Ini</h2></div>
                    <button class="button button-secondary button-small" onclick="navigate('catalog')">Lihat Semua</button>
                </div>
                <div class="product-grid">${seedProducts.map(productCard).join('')}</div>
            </div>`;

        const catalogPage = () => {
            const list = seedProducts.filter(p => !state.category || p.category === state.category);
            return `
            <div class="container page-wrap">
                <div class="breadcrumb"><a href="#" onclick="navigate('home')">Beranda</a><span>/</span><span>Katalog Kostum</span></div>
                <div class="page-intro"><div><span class="eyebrow">Koleksi Lengkap</span><h1 class="page-title">Katalog Kostum</h1><p>Pilih karakter favoritmu dan tentukan durasi penyewaan.</p></div></div>
                <div class="catalog-layout">
                    <aside class="filter-panel">
                        <strong>Kategori</strong>
                        <div style="margin-top:10px;">
                            <label class="filter-label"><input type="radio" name="cat" onclick="state.category='';render()" ${!state.category?'checked':''}> Semua Kategori</label>
                            <label class="filter-label"><input type="radio" name="cat" onclick="state.category='Anime';render()" ${state.category==='Anime'?'checked':''}> Anime</label>
                            <label class="filter-label"><input type="radio" name="cat" onclick="state.category='Game';render()" ${state.category==='Game'?'checked':''}> Game</label>
                        </div>
                    </aside>
                    <div><div class="product-grid">${list.map(productCard).join('')}</div></div>
                </div>
            </div>`;
        };

        const detailPage = () => {
            const p = seedProducts.find(x => x.id === state.productId) || seedProducts[0];
            const subtotal = p.price * state.days;
            const total = subtotal + 18000 + p.deposit;
            return `
            <div class="container page-wrap">
                <div class="breadcrumb"><a href="#" onclick="navigate('catalog')">Katalog</a><span>/</span><span>${p.name}</span></div>
                <div class="detail-layout">
                    <div><img class="detail-main-image" src="${p.image}" alt="${p.name}"></div>
                    <div>
                        <span class="eyebrow">${p.series}</span>
                        <h1 style="margin:8px 0;">${p.name}</h1>
                        <p class="muted">${p.description}</p>
                        <div class="detail-price">${money(p.price)} <small class="muted" style="font-size:0.8rem">/ hari</small></div>
                        <div class="field"><label>Pilih Ukuran Badan</label>
                            <div class="size-row">${p.size.map(s => `<button class="size-option ${state.size===s?'selected':''}" onclick="state.size='${s}';render()">${s}</button>`).join('')}</div>
                        </div>
                        <div class="field" style="margin-top:12px;"><label>Lama Sewa</label>
                            <select class="select" onchange="state.days=Number(this.value);render()">
                                ${[1,2,3,4,5,7].map(d => `<option value="${d}" ${state.days===d?'selected':''}>${d} Hari</option>`).join('')}
                            </select>
                        </div>
                        <div class="price-box">
                            <div class="price-line"><span>Sewa (${state.days} hari)</span><strong>${money(subtotal)}</strong></div>
                            <div class="price-line"><span>Estimasi Pengiriman JNE</span><strong>Rp18.000</strong></div>
                            <div class="price-line"><span>Deposit Refundable</span><strong>${money(p.deposit)}</strong></div>
                            <div class="price-line total"><span>Total Estimasi</span><strong>${money(total)}</strong></div>
                        </div>
                        <button class="button button-primary" style="width:100%;" onclick="navigate('checkout')">Lanjut ke Pemesanan</button>
                    </div>
                </div>
            </div>`;
        };

        const checkoutPage = () => {
            const p = seedProducts.find(x => x.id === state.productId) || seedProducts[0];
            const total = (p.price * state.days) + 18000 + p.deposit;
            return `
            <div class="container page-wrap">
                <div class="breadcrumb"><a href="#" onclick="navigate('detail')">Detail</a><span>/</span><span>Checkout</span></div>
                <div class="page-intro"><div><span class="eyebrow">Formulir</span><h1 class="page-title">Penyewaan Kostum</h1></div></div>
                <form onsubmit="event.preventDefault(); submitOrder('${p.id}')" class="checkout-layout">
                    <div>
                        <div class="form-section">
                            <h3 style="margin-top:0;">1. Data Diri Penyewa</h3>
                            <div class="field"><label>Nama Lengkap</label><input class="input" id="c-name" required placeholder="Hilma Rida"></div>
                            <div class="field"><label>Nomor WhatsApp</label><input class="input" id="c-phone" required type="tel" placeholder="08xxxxxxxxxx"></div>
                            <div class="field"><label>Alamat Lengkap Pengiriman</label><textarea class="textarea" id="c-addr" required placeholder="Jl. Palembang - Indralaya..."></textarea></div>
                        </div>
                        <div class="form-section">
                            <h3 style="margin-top:0;">2. Pembayaran DP (Minimal 50%)</h3>
                            <div class="notice">Transfer DP sebesar <strong>${money(Math.ceil(total*0.5))}</strong> ke Rekening BCA / DANA Let'sCosplay, lalu unggah bukti transfer di bawah.</div>
                            <div class="field" style="margin-top:12px;"><label>Unggah Bukti Transfer</label><input class="input" type="file" required accept="image/*"></div>
                        </div>
                    </div>
                    <div>
                        <div class="form-section" style="position:sticky; top:90px;">
                            <h3 style="margin-top:0;">Ringkasan</h3>
                            <p style="margin:4px 0;"><strong>${p.name}</strong></p>
                            <p class="muted small" style="margin:0 0 12px 0;">Ukuran ${state.size} · ${state.days} hari</p>
                            <div class="price-line total"><span>Total Tagihan</span><strong>${money(total)}</strong></div>
                            <button type="submit" class="button button-primary" style="width:100%; margin-top:16px;">Kirim Pesanan</button>
                        </div>
                    </div>
                </form>
            </div>`;
        };

        const submitOrder = (pid) => {
            const p = seedProducts.find(x => x.id === pid);
            const order = {
                id: 'LC-' + Math.floor(100000 + Math.random() * 900000),
                name: document.getElementById('c-name').value,
                product: p.name,
                image: p.image,
                size: state.size,
                days: state.days,
                total: (p.price * state.days) + 18000 + p.deposit,
                status: 'Menunggu Verifikasi Admin'
            };
            state.orders.unshift(order);
            localStorage.setItem(STORAGE_KEYS.orders, JSON.stringify(state.orders));
            showToast('Pesanan berhasil dibuat!');
            navigate('orders');
        };

        const ordersPage = () => `
            <div class="container page-wrap">
                <div class="page-intro"><div><span class="eyebrow">Aktivitas</span><h1 class="page-title">Pesanan Saya</h1></div><button class="button button-primary button-small" onclick="navigate('catalog')">Sewa Lagi</button></div>
                ${state.orders.length ? state.orders.map(o => `
                    <div class="order-card">
                        <img src="${o.image}" alt="">
                        <div>
                            <strong>${o.product} (${o.id})</strong>
                            <p class="muted small" style="margin:4px 0;">Penyewa: ${o.name} · Ukuran ${o.size} · ${o.days} hari</p>
                            <span class="status-pill">${o.status}</span>
                        </div>
                        <div style="text-align:right;"><strong>${money(o.total)}</strong></div>
                    </div>
                `).join('') : '<div style="text-align:center; padding:40px; border:1px dashed var(--line); border-radius:12px;" class="muted">Belum ada pesanan aktif. Yuk pilih kostum favoritmu!</div>'}
            </div>`;

        const adminOverview = () => `
            <div style="margin-bottom:24px;"><h1>Ringkasan Dashboard Admin</h1></div>
            <div class="stat-grid">
                <article class="stat-card"><span class="muted small">Rental Aktif</span><strong>14 Item</strong></article>
                <article class="stat-card"><span class="muted small">Verifikasi Menunggu</span><strong>${state.orders.length} Pesanan</strong></article>
                <article class="stat-card"><span class="muted small">Total Pendapatan</span><strong>Rp 14.250.000</strong></article>
                <article class="stat-card"><span class="muted small">Stok Kostum</span><strong>24 Unit</strong></article>
            </div>`;

        const adminInventory = () => `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h1>Kelola Katalog Kostum</h1>
                <button class="button button-primary button-small" onclick="showToast('Simulasi tambah kostum baru')">+ Tambah Kostum</button>
            </div>
            <div class="table-wrap"><table class="data-table"><thead><tr><th>Kostum</th><th>Kategori</th><th>Stok</th><th>Harga / Hari</th></tr></thead><tbody>
                ${seedProducts.map(p => `<tr><td><strong>${p.name}</strong><br><span class="muted">${p.series}</span></td><td>${p.category}</td><td>${p.stock} Unit</td><td>${money(p.price)}</td></tr>`).join('')}
            </tbody></table></div>`;

        const adminOrders = () => `
            <div style="margin-bottom:20px;"><h1>Verifikasi Pesanan Masuk</h1></div>
            ${state.orders.length ? state.orders.map(o => `
                <div class="order-card" style="grid-template-columns: 60px 1fr auto;">
                    <img src="${o.image}" alt="" style="width:60px; height:70px;">
                    <div>
                        <strong>${o.name} — ${o.product} (${o.id})</strong>
                        <p class="muted small" style="margin:4px 0;">Ukuran ${o.size} · Total: ${money(o.total)}</p>
                        <span class="status-pill">${o.status}</span>
                    </div>
                    <div><button class="button button-primary button-small" onclick="showToast('Pesanan disetujui admin!')">Setujui & ACC</button></div>
                </div>
            `).join('') : '<div style="text-align:center; padding:40px;" class="muted">Belum ada pesanan dari penyewa yang perlu diverifikasi.</div>'}`;

        const adminPage = () => `
            <div class="admin-shell">
                <aside class="admin-sidebar">
                    <strong style="font-size:0.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;">Menu Admin</strong>
                    <nav class="admin-nav" style="margin-top:10px;">
                        <a onclick="state.adminSection='overview';render()" class="${state.adminSection==='overview'?'active':''}">Ringkasan</a>
                        <a onclick="state.adminSection='inventory';render()" class="${state.adminSection==='inventory'?'active':''}">Kelola Katalog</a>
                        <a onclick="state.adminSection='orders';render()" class="${state.adminSection==='orders'?'active':''}">Verifikasi Pesanan</a>
                    </nav>
                </aside>
                <section class="admin-content">
                    ${state.adminSection==='overview'?adminOverview():state.adminSection==='inventory'?adminInventory():adminOrders()}
                </section>
            </div>`;

        const render = () => {
            const content = state.role === 'admin' ? adminPage() : (
                state.page === 'home' ? homePage() :
                state.page === 'catalog' ? catalogPage() :
                state.page === 'detail' ? detailPage() :
                state.page === 'checkout' ? checkoutPage() :
                state.page === 'orders' ? ordersPage() : homePage()
            );
            document.getElementById('app').innerHTML = header() + `<main>${content}</main>` + footer();
        };

        const savedTheme = localStorage.getItem(STORAGE_KEYS.theme) || 'light';
        document.documentElement.dataset.theme = savedTheme;
        render();
    </script>
</body>
</html>
